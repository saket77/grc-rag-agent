[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zania-grc-rag"
version = "0.1.0"
description = "Document-grounded question answering with FastAPI, LangChain, and FAISS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.6,<3",
  "pydantic>=2.9,<3",
  "starlette>=0.46,<2",
  "httpx>=0.27,<1",
  "openai>=2,<4",
  "numpy>=1.26,<3",
  "langsmith>=0.3,<1",
  "langchain-core>=1,<2",
  "langchain-openai>=0.3,<2",
  "langchain-community>=0.3,<1",
  "langchain-text-splitters>=0.3,<2",
  "faiss-cpu>=1.9,<2",
  "pypdf>=5,<7",
  "simplejson>=4.1,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pip-tools>=7.4,<8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
